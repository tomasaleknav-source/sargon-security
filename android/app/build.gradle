plugins {
    id 'com.android.application'
}

android {
    namespace 'lt.sargon.android'
    compileSdk 35

    defaultConfig {
        applicationId 'lt.sargon.android'
        minSdk 26
        targetSdk 35
        versionCode 5300
        versionName '0.53.0-android'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }

    // The CI APK is a side-by-side preview; it must not overwrite the public install.
    buildTypes {
        debug {
            applicationIdSuffix '.preview530'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'SARGON Security Preview 0.53.0']
        }
    }
}

dependencies {
    implementation 'com.google.guava:guava:33.4.8-android'\n    implementation 'org.bouncycastle:bcpg-jdk18on:1.80'\n    testImplementation 'junit:junit:4.13.2'
}
